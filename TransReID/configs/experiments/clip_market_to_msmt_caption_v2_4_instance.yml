MODEL:
  NAME: "ViT-B-16"
  BACKBONE:
    NAME: "clip_vit_b16"
    PRETRAINED: True
  HEAD:
    EMBED_DIM: 768
  CAPTION: False

OBJECTIVE:
  LABEL_SMOOTHING: 0.0
  CAPTION:
    ENABLED: True
    WEIGHT: 0.1
    SELECTION: "random"
    MISSING_POLICY: "error"
    TEXT_ENCODER: "clip_legacy"
    TEXT_TRAINABLE: False
    PROJECTION_DIM: 512
    TEMPERATURE: 0.07
    POSITIVE_MODE: "instance"

INPUT:
  PERSON_REID: True
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  SOURCES: "market1501"
  TARGETS: "msmt17"

DATALOADER:
  SAMPLER: "RandomIdentitySampler"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  IMS_PER_BATCH: 64
  OPTIMIZER_NAME: "Adam"
  MAX_EPOCHS: 60
  BASE_LR: 0.000001
  CHECKPOINT_PERIOD: 10
  EVAL_PERIOD: 10
  LOG_PERIOD: 100
  SEED: 1234
  AMP_ENABLED: True
  AMP_INIT_SCALE: 512.0

TEST:
  IMS_PER_BATCH: 128
  FEAT_NORM: "yes"
