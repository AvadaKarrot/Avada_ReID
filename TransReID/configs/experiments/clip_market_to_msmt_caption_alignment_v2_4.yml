MODEL:
  DEVICE: "cuda"
  DEVICE_ID: "'0'"
  NAME: "ViT-B-16"
  PRETRAIN_PATH: "/root/autodl-tmp/pretrained/clip/ViT-B-16.pt"
  STRIDE_SIZE: [16, 16]
  ID_LOSS_WEIGHT: 1.0
  TRIPLET_LOSS_WEIGHT: 1.0
  SIE_CAMERA: False
  SIE_VIEW: False
  BACKBONE:
    NAME: "clip_vit_b16"
    PRETRAINED: True
  HEAD:
    TYPE: "clipreid_parity"
    EMBED_DIM: 768
  CAPTION: False

OBJECTIVE:
  LABEL_SMOOTHING: 0.1
  CAPTION:
    ENABLED: True
    WEIGHT: 0.1
    FILE: "/root/autodl-tmp/Avada_ReID/TransReID/caption_tools/output/final/v2.4/captions.jsonl"
    # V2.4 stores the comprehensive description first. Keeping this fixed
    # makes the Caption run differ from image-only only by the extra loss and
    # does not consume Python RNG state inside dataset workers.
    SELECTION: "first"
    MISSING_POLICY: "error"
    TEXT_ENCODER: "clip_legacy"
    TEXT_TRAINABLE: False
    FEATURE_LEVEL: "global"
    USE_PROJECTION: False
    PROJECTION_DIM: 512
    TEMPERATURE: 0.07
    POSITIVE_MODE: "pid"

INPUT:
  PERSON_REID: True
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  SOURCES: "market1501"
  TARGETS: "msmt17"
  ROOT_DIR: "/root/autodl-tmp/datasets"
  TRANSFORMS:
    ["random_flip", "pad", "random_crop", "random_erase", "color_jitter"]

DATALOADER:
  SAMPLER: "RandomIdentitySampler"
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  IMS_PER_BATCH: 64
  OPTIMIZER_NAME: "Adam"
  MAX_EPOCHS: 60
  BASE_LR: 0.000005
  WARMUP_METHOD: "linear"
  WARMUP_ITERS: 10
  WARMUP_FACTOR: 0.1
  WEIGHT_DECAY: 0.0001
  WEIGHT_DECAY_BIAS: 0.0001
  LARGE_FC_LR: False
  BIAS_LR_FACTOR: 2
  STEPS: [30, 50]
  GAMMA: 0.1
  CHECKPOINT_PERIOD: 10
  EVAL_PERIOD: 10
  LOG_PERIOD: 100
  SEED: 1234
  AMP_ENABLED: True
  AMP_INIT_SCALE: 512.0

TEST:
  IMS_PER_BATCH: 128
  FEAT_NORM: "yes"
  NECK_FEAT: "before"

OUTPUT_DIR: "/root/autodl-tmp/experiments/unified_clipreid_caption_alignment/market_to_msmt17/seed_1234"
